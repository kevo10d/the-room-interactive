<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>The Room — Interactive Descent</title>
  <style>
    :root {
      --bg: #07060a;
      --ink: #f4e9ef;
      --muted: #b9a3b0;
      --accent: #e8a0b8;
      --line: rgba(232, 160, 184, 0.28);
      --warn: #f0c48a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(196, 92, 122, 0.18), transparent 55%),
        radial-gradient(900px 500px at 100% 10%, rgba(80, 40, 70, 0.25), transparent 50%),
        var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }
    body { padding: 20px 16px 48px; }
    .wrap { max-width: 760px; margin: 0 auto; }
    header.app {
      display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
      margin-bottom: 18px; border-bottom: 1px solid var(--line); padding-bottom: 12px;
    }
    header.app h1 {
      font-size: 1.15rem; letter-spacing: 0.14em; text-transform: uppercase; margin: 0;
      font-weight: 600; color: var(--accent);
    }
    header.app p { margin: 4px 0 0; font-size: 0.78rem; color: var(--muted); }
    .tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .tools button {
      font-family: system-ui, sans-serif; font-size: 0.72rem; letter-spacing: 0.06em;
      text-transform: uppercase; background: transparent; color: var(--muted);
      border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; cursor: pointer;
    }
    .tools button[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); }
    .card {
      background: linear-gradient(180deg, rgba(26,20,31,0.96), rgba(12,10,14,0.94));
      border: 1px solid var(--line); border-radius: 18px; padding: 22px 22px 18px;
    }
    .kicker {
      font-family: system-ui, sans-serif; font-size: 0.7rem; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--accent); margin: 0 0 10px;
    }
    .story { font-size: 1.05rem; line-height: 1.65; white-space: pre-wrap; }
    .choices { display: grid; gap: 10px; margin-top: 18px; }
    .choices button {
      text-align: left; font-family: Georgia, serif; font-size: 0.98rem; line-height: 1.4;
      color: var(--ink); background: #221823; border: 1px solid var(--line);
      border-radius: 12px; padding: 12px 14px; cursor: pointer;
    }
    .choices button:hover, .choices button:focus { border-color: var(--accent); outline: none; background: #2b1d28; }
    .choices button span {
      display: block; font-family: system-ui, sans-serif; font-size: 0.68rem;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px;
    }
    .note, .progress { font-family: system-ui, sans-serif; font-size: 0.78rem; color: var(--muted); margin-top: 12px; }
    .static-layer {
      pointer-events: none; position: fixed; inset: 0; opacity: 0; transition: opacity 1.6s ease;
      background: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px);
      mix-blend-mode: overlay;
    }
    body.static-on .static-layer { opacity: 0.22; }
    body.safe .static-layer { display: none; }
  </style>
</head>
<body>
  <div class="static-layer"></div>
  <div class="wrap">
    <header class="app">
      <div>
        <h1>The Room</h1>
        <p>A choose-your-own descent • adult • looping</p>
      </div>
      <div class="tools">
        <button type="button" id="safeBtn" aria-pressed="false">Seizure-safe</button>
        <button type="button" id="restartBtn">Restart</button>
      </div>
    </header>
    <div class="card">
      <p class="kicker" id="kicker">Prologue</p>
      <div class="story" id="story"></div>
      <div class="choices" id="choices"></div>
      <p class="progress" id="progress"></p>
      <p class="note" id="note"></p>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
